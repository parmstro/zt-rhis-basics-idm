---
virtualmachines:
  - name: "idm1"
#    image: "rhel-10-0-07-09-25-3"
    image: "rhel-9.7"
    bootloader: efi
    memory: "8G"
    cores: 1
    image_size: "40G"
    packages:
      - git
      - tmux
    tags:
      - key: "AnsibleGroup"
        value: "nodes"
    networks:
      - default
      - secondary
    services:
      - name: idm1-webui
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: idm1-webui

    routes:
      - name: idm1-webui
        host: idm1-webui
        service: idm1-webui
        targetPort: 80
        tls: true
        tls_termination: edge

  - name: "idm2"
#    image: "rhel-10-0-07-09-25-3"
    image: "rhel-9.7"
    bootloader: efi
    memory: "8G"
    cores: 1
    image_size: "40G"
    packages:
      - git
      - tmux
    tags:
      - key: "AnsibleGroup"
        value: "nodes"
    networks:
      - default
      - secondary
    services:
      - name: idm2-webui
        ports:
          - port: 80
            protocol: TCP
            targetPort: 80
            name: idm2-webui

    routes:
      - name: idm2-webui
        host: idm2-webui
        service: idm2-webui
        targetPort: 80
        tls: true
        tls_termination: edge

  - name: "client1"
#    image: "rhel-10-0-07-09-25-3"
    image: "rhel-9.7"
    bootloader: efi
    memory: "4G"
    cores: 1
    image_size: "40G"
    packages:
      - git
      - tmux
    tags:
      - key: "AnsibleGroup"
        value: "nodes"
    networks:
      - default
      - secondary

  - name: "client2"
#    image: "rhel-10-0-07-09-25-3"
    image: "rhel-9.7"
    bootloader: efi
    memory: "4G"
    cores: 1
    image_size: "40G"
    packages:
      - git
      - tmux
    tags:
      - key: "AnsibleGroup"
        value: "nodes"
    networks:
      - default
      - secondary

  - name: "provisioner"
#    image: "rhel-10-0-07-09-25-3"
    image: "rhel-9.7"
    bootloader: efi
    memory: "8G"
    cores: 1
    image_size: "40G"
    packages:
      - tmux
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
    networks:
      - default
      - secondary
    services:
      - name: vscode-8080
        ports:
          - port: 8080
            protocol: TCP
            targetPort: 8080
            name: vscode
    routes:
      - name: vscode-8080
        host: vscode
        service: vscode-8080
        targetPort: 8080
        tls: true
        tls_termination: edge
